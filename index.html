<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Roster Sync</title>

  <!-- Web App Metadata for Mobile Home Screen -->
  <meta name="apple-mobile-web-app-title" content="Roster Sync">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Dynamic SVG App Icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%23007AFF'><rect width='512' height='512' rx='100' fill='%23007AFF'/><path d='M160 120v-30h40v30h112v-30h40v30h40c22 0 40 18 40 40v240c0 22-18 40-40 40H120c-22 0-40-18-40-40V160c0-22 18-40 40-40h40zm-40 120v160h272V240H120zm136 20c35.3 0 64 28.7 64 64h-30l45 45 45-45h-30c0-53-43-96-94-96s-94 43-94 96h30c0-35.3 28.7-64 64-64z' fill='white'/></svg>">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%23007AFF'><rect width='512' height='512' rx='100' fill='%23007AFF'/><path d='M160 120v-30h40v30h112v-30h40v30h40c22 0 40 18 40 40v240c0 22-18 40-40 40H120c-22 0-40-18-40-40V160c0-22 18-40 40-40h40zm-40 120v160h272V240H120zm136 20c35.3 0 64 28.7 64 64h-30l45 45 45-45h-30c0-53-43-96-94-96s-94 43-94 96h30c0-35.3 28.7-64 64-64z' fill='white'/></svg>">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f2f2f7;
      -webkit-user-select: none;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      width: 85%;
      max-width: 320px;
    }
    .icon-container {
      margin-bottom: 16px;
    }
    h2 {
      margin: 0 0 15px 0;
      font-size: 20px;
      color: #1c1c1e;
    }
    p {
      font-size: 13px;
      color: #8e8e93;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border: 1px solid #c7c7cc;
      border-radius: 10px;
      box-sizing: border-box;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus {
      border-color: #007aff;
    }
    button {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
      transition: transform 0.1s ease, background-color 0.2s ease;
    }
    button:active {
      transform: scale(0.97);
      background-color: #0056b3;
    }
    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #8e8e93;
      min-height: 20px;
      word-break: break-word;
    }
    textarea {
      width: 100%;
      height: 60px;
      font-size: 12px;
      padding: 8px;
      border: 1px solid #e5e5ea;
      border-radius: 8px;
      background: #f9f9fb;
      resize: none;
      margin-top: 10px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="card" id="contentCard">
    <!-- Dynamic content injected via script depending on URL parameters -->
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const webapp_url = urlParams.get('webapp_url');
    const card = document.getElementById('contentCard');

    const svgIcon = `
      <div class="icon-container">
        <svg width="56" height="56" viewBox="0 0 512 512" fill="%23007AFF">
          <rect width="512" height="512" rx="100"/>
          <path d="M160 120v-30h40v30h112v-30h40v30h40c22 0 40 18 40 40v240c0 22-18 40-40 40H120c-22 0-40-18-40-40V160c0-22 18-40 40-40h40zm-40 120v160h272V240H120zm136 20c35.3 0 64 28.7 64 64h-30l45 45 45-45h-30c0-53-43-96-94-96s-94 43-94 96h30c0-35.3 28.7-64 64-64z" fill="white"/>
        </svg>
      </div>`;

    if (!webapp_url) {
      // SETUP / GENERATOR MODE (When colleague visits the plain link)
      card.innerHTML = `
        ${svgIcon}
        <h2>Setup Roster Sync</h2>
        <p>Paste your Google Apps Script Web App URL below to generate your personalized sync link.</p>
        <input type="text" id="inputUrl" placeholder="https://script.google.com/.../exec">
        <button onclick="generateLink()">Generate My Link</button>
        <div id="status"></div>
      `;
    } else {
      // ACTIVE SYNC MODE (When colleague opens their saved personal bookmark)
      card.innerHTML = `
        ${svgIcon}
        <h2>Calendar & Update</h2>
        <button id="syncBtn" onclick="runSync()">Sync Calendar</button>
        <div id="status">Tap to sync Google Calendar</div>
      `;
    }

    function generateLink() {
      const inputVal = document.getElementById('inputUrl').value.trim();
      const status = document.getElementById('status');

      if (!inputVal.startsWith('https://script.google.com')) {
        status.style.color = '#ff3b30';
        status.innerText = "❌ Please enter a valid Apps Script URL.";
        return;
      }

      const generatedUrl = window.location.origin + window.location.pathname + '?webapp_url=' + encodeURIComponent(inputVal);
      
      status.style.color = '#34c759';
      status.innerHTML = `
        ✅ Link generated successfully!<br>
        <textarea readonly id="genBox">${generatedUrl}</textarea>
        <button style="margin-top: 8px; padding: 10px; font-size: 14px; background: #34c759;" onclick="copyLink()">Copy Link to Clipboard</button>
      `;
    }

    function copyLink() {
      const box = document.getElementById('genBox');
      box.select();
      navigator.clipboard.writeText(box.value).then(() => {
        alert("Personal link copied! Open this link on your phone and add it to your home screen.");
      });
    }

    function runSync() {
      const btn = document.getElementById('syncBtn');
      const status = document.getElementById('status');

      btn.disabled = true;
      btn.style.opacity = '0.6';
      status.style.color = '#007aff';
      status.innerText = "Triggering update...";

      const targetUrl = webapp_url + (webapp_url.includes('?') ? '&' : '?') + 'run=true';

      fetch(targetUrl)
      .then(response => response.text())
      .then(data => {
        if (data.startsWith("SUCCESS:")) {
          status.style.color = '#34c759';
          status.innerText = "✅ " + data.replace("SUCCESS:", "").trim();
        } else if (data.startsWith("INFO:")) {
          status.style.color = '#ff9500';
          status.innerText = "⚠️ " + data.replace("INFO:", "").trim();
        } else {
          status.style.color = '#ff3b30';
          status.innerText = "❌ " + data.replace("ERROR:", "").trim();
        }
      })
      .catch(() => {
        status.style.color = '#ff3b30';
        status.innerText = "❌ Network connection error.";
      })
      .finally(() => {
        setTimeout(() => {
          btn.disabled = false;
          btn.style.opacity = '1';
        }, 2000);
      });
    }
  </script>
</body>
</html>
