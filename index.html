<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roster Sync</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#007aff">

  <!-- Custom icon so it doesn't show a generic letter -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background: #f2f2f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      width: 85%;
      max-width: 340px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      color: #1c1c1e;
      font-size: 22px;
    }
    p {
      color: #8e8e93;
      font-size: 14px;
      margin-bottom: 25px;
    }
    button {
      background: #007aff;
      color: white;
      border: none;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,122,255,0.3);
      transition: opacity 0.2s;
    }
    button:active {
      opacity: 0.7;
    }
    #status {
      margin-top: 22px;
      font-size: 15px;
      font-weight: 500;
      color: #3c3c43;
      min-height: 44px;
      word-break: break-word;
    }
  </style>
</head>  
<body>
  <div class="card">
    <h2>Roster Sync</h2>
    <p>Tap below to trigger an immediate calendar sync check.</p>
    <button id="syncBtn" onclick="triggerSync()">Sync Now</button>
    <div id="status">Ready</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const webapp_url = urlParams.get('webapp_url');

    function triggerSync() {
      const btn = document.getElementById('syncBtn');
      const status = document.getElementById('status');

      if (!webapp_url) {
        status.style.color = '#ff3b30';
        status.innerText = "❌ No URL inserted, please add your webapp url in the address line.";
        return;
      }
      
      btn.disabled = true;
      btn.style.opacity = '0.5';
      status.style.color = '#3c3c43';
      status.innerText = "⏳ Syncing...";

      const targetUrl = webapp_url + (webapp_url.includes('?') ? '&' : '?') + 'run=true';

      fetch(targetUrl)
        .then(response => response.text())
        .then(data => {
          if (data.startsWith("SUCCESS:")) {
            status.style.color = '#34c759';
            status.innerText = "✅ " + data.replace("SUCCESS:", "").trim();
          } else if (data.startsWith("INFO:")) {
            status.style.color = '#ff9500';
            status.innerText = "⚠️ " + data.replace("INFO:", "").trim();
          } else {
            status.style.color = '#ff3b30';
            status.innerText = "❌ " + data.replace("ERROR:", "").trim();
          }
        })
        .catch(err => {
          status.style.color = '#ff3b30';
          status.innerText = "❌ Connection failed: " + err.message;
        })
        .finally(() => {
          setTimeout(() => {
            btn.disabled = false;
            btn.style.opacity = '1';
          }, 2000);
        });
    }
  </script>
</body>
</html>
